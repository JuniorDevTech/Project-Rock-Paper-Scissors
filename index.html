<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pierre Feuille Ciseaux</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>🎮 Pierre - Feuille - Ciseaux</h1>
      <p class="subtitle">Défie l'ordinateur et tente de gagner !</p>

      <div class="choices">
        <button id="pierre">🪨 Pierre</button>
        <button id="feuille">📄 Feuille</button>
        <button id="ciseaux">✂️ Ciseaux</button>
      </div>

      <div id="resultat" class="resultat">
        Choisissez une option pour commencer.
      </div>

      <div id="score" class="score">Joueur : 0 | Ordinateur : 0</div>

      <button id="rejouer" class="restart">🔄 Rejouer</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
